[project]
name = "dragonfly-py-sql"
version = "0.1.0"
description = "A SQL driver for DragonflyDB SEARCH indexes"
requires-python = ">=3.12"
dependencies = [
    "redis",
    "sqlglot",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dragonfly_sql"]
